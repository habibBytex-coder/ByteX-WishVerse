<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magical Birthday Wish</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        night: { bg: '#0b0415', card: '#160a2a', accent: '#ec4899', glow: '#f43f5e' },
                        rose: { bg: '#1a0814', card: '#2c1022', accent: '#fb7185', glow: '#e11d48' },
                        sunset: { bg: '#1c0a0c', card: '#2d1217', accent: '#f97316', glow: '#ea580c' },
                        ocean: { bg: '#040d1a', card: '#0a1930', accent: '#38bdf8', glow: '#0ea5e9' }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta+Sans', 'Hind Siliguri', sans-serif;
            touch-action: manipulation;
            overscroll-behavior: none;
        }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-text {
            text-shadow: 0 0 20px rgba(236, 72, 153, 0.6), 0 0 40px rgba(244, 63, 94, 0.4);
        }
        .glow-box {
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.25), inset 0 0 15px rgba(244, 63, 94, 0.15);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }
        .animate-float {
            animation: float 5s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 25px #ec4899); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 2.5s ease-in-out infinite;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(236,72,153,0.4); border-radius: 3px; }
    </style>
</head>
<body class="bg-night-bg text-white min-h-screen overflow-x-hidden relative select-none">

    <!-- Canvas Background for Magical Particles, Petals & Tree -->
    <canvas id="magicCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <!-- Global Audio Element -->
    <audio id="bgMusic" loop preload="auto"></audio>

    <!-- App Root Container -->
    <div id="app" class="relative z-10 min-h-screen flex flex-col justify-between">
        <!-- Dynamic Views Injected Here -->
    </div>

    <!-- Audio Control Floating Widget (Visible during wish/preview) -->
    <div id="audioWidget" class="fixed top-4 right-4 z-50 hidden items-center gap-2 glass-panel px-3 py-1.5 rounded-full shadow-lg">
        <button id="audioToggleBtn" onclick="toggleAudioPlayback()" class="w-8 h-8 rounded-full bg-pink-600/80 flex items-center justify-center text-white text-sm hover:bg-pink-500 transition-all">
            🎵
        </button>
        <span id="audioLabel" class="text-xs font-medium text-pink-200 pr-1">Play Music</span>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden glass-panel px-5 py-3 rounded-2xl text-sm font-medium shadow-2xl border border-pink-500/30 text-pink-200 transition-all duration-300"></div>

    <!-- JavaScript Application Engine -->
    <script>
        // --- State & Configuration ---
        const DEFAULT_CONFIG = {
            id: 'demo',
            linkName: 'sarah-birthday',
            recipientName: 'Sarah',
            password: '',
            headline: 'Happy Birthday 🎂',
            tapHint: 'Tap the magical heart to reveal your surprise ✨',
            cardGreeting: 'Dearest {name},',
            message: 'On this special day, I wish you endless joy, radiant happiness, and all the success in the world. May your year ahead blossom just like this magical tree filled with love and beautiful moments! 🌸✨',
            signOff: 'With all my love,\nYour Friend',
            counterStartDate: '2025-11-19T00:00:00',
            counterLabel: 'Days of Beautiful Friendship',
            musicUrl: 'https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=romantic-ambient-111043.mp3',
            theme: 'night'
        };

        let currentConfig = { ...DEFAULT_CONFIG };
        let activeView = 'home'; // 'home', 'create', 'wish', 'password'
        let audioPlaying = false;
        let animationUnlocked = false;

        // --- Theme Definitions ---
        const THEMES = {
            night: { bg: '#0b0415', card: 'rgba(22, 10, 42, 0.75)', accent: '#ec4899', glow: '#f43f5e', text: '#fbcfe8' },
            rose: { bg: '#1a0814', card: 'rgba(44, 16, 34, 0.75)', accent: '#fb7185', glow: '#e11d48', text: '#fecdd3' },
            sunset: { bg: '#1c0a0c', card: 'rgba(45, 18, 23, 0.75)', accent: '#f97316', glow: '#ea580c', text: '#ffedd5' },
            ocean: { bg: '#040d1a', card: 'rgba(10, 25, 48, 0.75)', accent: '#38bdf8', glow: '#0ea5e9', text: '#e0f2fe' }
        };

        function applyTheme(themeName) {
            const t = THEMES[themeName] || THEMES.night;
            document.body.style.backgroundColor = t.bg;
        }

        // --- Router & Initialization ---
        window.addEventListener('DOMContentLoaded', () => {
            handleRoute();
            window.addEventListener('hashchange', handleRoute);
        });

        async function handleRoute() {
            const hash = window.location.hash || '#/';
            const [route, queryString] = hash.split('?');
            const params = new URLSearchParams(queryString);

            document.getElementById('audioWidget').classList.add('hidden');

            if (route === '#/create') {
                activeView = 'create';
                renderCreateView();
            } else if (route === '#/wish') {
                const wishId = params.get('id');
                if (wishId) {
                    await loadWishData(wishId);
                } else {
                    currentConfig = { ...DEFAULT_CONFIG };
                }
                
                if (currentConfig.password && !sessionStorage.getItem('auth_' + currentConfig.id)) {
                    activeView = 'password';
                    renderPasswordView();
                } else {
                    activeView = 'wish';
                    renderWishView();
                }
            } else {
                activeView = 'home';
                renderHomeView();
            }
        }

        // --- Cloud Storage Simulator (LocalStorage / URL Sync) ---
        function saveWishToStorage(config) {
            const id = config.linkName ? config.linkName.toLowerCase().replace(/[^a-z0-9]/g, '-') + '-' + Math.random().toString(36).substring(2, 7) : 'wish-' + Date.now();
            config.id = id;
            localStorage.setItem('wish_' + id, JSON.stringify(config));
            return id;
        }

        async function loadWishData(id) {
            const localData = localStorage.getItem('wish_' + id);
            if (localData) {
                try {
                    currentConfig = JSON.parse(localData);
                    return;
                } catch(e) {}
            }
            // Fallback demo preset if ID not found
            currentConfig = { ...DEFAULT_CONFIG, id: id, recipientName: id.split('-')[0] || 'Special Someone' };
        }

        // --- Toast Notification ---
        function showToast(msg, duration = 3000) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), duration);
        }

        // --- Audio Management ---
        function initAudio(url) {
            const audio = document.getElementById('bgMusic');
            if (audio.src !== url) {
                audio.src = url;
                audio.load();
            }
        }

        function toggleAudioPlayback() {
            const audio = document.getElementById('bgMusic');
            const label = document.getElementById('audioLabel');
            if (audio.paused) {
                audio.play().then(() => {
                    audioPlaying = true;
                    label.textContent = 'Pause Music';
                }).catch(e => showToast('Tap page to enable audio'));
            } else {
                audio.pause();
                audioPlaying = false;
                label.textContent = 'Play Music';
            }
        }

        // --- View Renders ---

        function renderHomeView() {
            applyTheme('night');
            document.getElementById('app').innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-6 text-center max-w-md mx-auto">
                    <div class="w-24 h-24 mb-6 rounded-full glass-panel flex items-center justify-center text-4xl animate-pulse-glow glow-box">
                        💖
                    </div>
                    <h1 class="font-cinzel text-3xl md:text-4xl font-bold mb-3 glow-text bg-gradient-to-r from-pink-400 via-rose-300 to-pink-500 bg-clip-text text-transparent">
                        Magical Birthday Wishes
                    </h1>
                    <p class="text-pink-200/80 text-sm md:text-base mb-8 leading-relaxed">
                        Create an unforgettable, interactive birthday surprise featuring a glowing heart tree, magical particle effects, live counters, and romantic music.
                    </p>
                    <div class="flex flex-col w-full gap-4">
                        <a href="#/create" class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 font-semibold shadow-lg shadow-pink-600/35 transition-all transform active:scale-95 flex items-center justify-center gap-2">
                            ✨ Create Birthday Wish
                        </a>
                        <a href="#/wish?id=demo" class="w-full py-3.5 px-6 rounded-2xl glass-panel hover:bg-white/10 font-medium transition-all text-pink-200">
                            👁️ View Demo Wish
                        </a>
                    </div>
                    <p class="mt-12 text-xs text-pink-300/40">Crafted with love for mobile & desktop</p>
                </div>
            `;
        }

        function renderCreateView() {
            applyTheme(currentConfig.theme);
            document.getElementById('app').innerHTML = `
                <div class="max-w-2xl mx-auto w-full p-4 md:p-8 pb-20">
                    <div class="flex items-center justify-between mb-6">
                        <a href="#/" class="text-sm text-pink-300 hover:text-white flex items-center gap-1">← Back</a>
                        <h1 class="font-cinzel text-xl font-bold text-pink-200">Wish Studio</h1>
                        <button onclick="previewWish()" class="text-xs bg-pink-600/30 border border-pink-500/50 px-3 py-1.5 rounded-full hover:bg-pink-600/50 transition-all">Live Preview 👀</button>
                    </div>

                    <div class="glass-panel p-6 rounded-3xl shadow-2xl space-y-6">
                        <!-- Recipient Settings -->
                        <div>
                            <h2 class="text-sm font-semibold text-pink-300 uppercase tracking-wider mb-3">1. Recipient & Link</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs text-pink-200/70 mb-1">Recipient Name</label>
                                    <input type="text" id="inpRecipient" value="${escapeHtml(currentConfig.recipientName)}" class="w-full bg-black/30 border border-pink-500/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500" placeholder="e.g. Sarah">
                                </div>
                                <div>
                                    <label class="block text-xs text-pink-200/70 mb-1">Custom Link Identifier</label>
                                    <input type="text" id="inpLinkName" value="${escapeHtml(currentConfig.linkName)}" class="w-full bg-black/30 border border-pink-500/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500" placeholder="e.g. sarah-birthday">
                                </div>
                            </div>
                        </div>

                        <!-- Message & Content -->
                        <div>
                            <h2 class="text-sm font-semibold text-pink-300 uppercase tracking-wider mb-3">2. Message & Typography</h2>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-xs text-pink-200/70 mb-1">Top Headline</label>
                                    <input type="text" id="inpHeadline" value="${escapeHtml(currentConfig.headline)}" class="w-full bg-black/30 border border-pink-500/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500">
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs text-pink-200/70 mb-1">Card Greeting (Use {name})</label>
                                        <input type="text" id="inpGreeting" value="${escapeHtml(currentConfig.cardGreeting)}" class="w-full bg-black/30 border border-pink-500/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs text-pink-200/70 mb-1">Theme Selection</label>
                                        <select id="inpTheme" onchange="updateBuilderTheme(this.value)" class="w-full bg-black/50 border border-pink-500/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500">
                                            <option value="night" ${currentConfig.theme==='night'?'selected':''}>Night Purple</option>
                                            <option value="rose" ${currentConfig.theme==='rose'?'selected':''}>Romantic Rose</option>
                                            <option value="sunset" ${currentConfig.theme==='sunset'?'selected':''}>Sunset Glow</option>
                                            <option value="ocean" ${currentConfig.theme==='ocean'?'selected':''}>Ocean Blue</option>
                                        </select>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs text-pink-200/70 mb-1">Custom Message (Supports Bengali, Unicode & Emojis)</label>
                                    <textarea id="inpMessage" rows="4" class="w-full bg-black/30 border border-pink-500/30 rounded-xl p-4 text-sm focus:outline-none focus:border-pink-500">${escapeHtml(currentConfig.message)}</textarea>
                                </div>
                                <div>
                                    <label class="block text-xs text-pink-200/70 mb-1">Sign-off</label>
                                    <input type="text" id="inpSignOff" value="${escapeHtml(currentConfig.signOff)}" class="w-full bg-black/30 border border-pink-500/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500">
                                </div>
                            </div>
                        </div>

                        <!-- Counter & Music -->
                        <div>
                            <h2 class="text-sm font-semibold text-pink-300 uppercase tracking-wider mb-3">3. Counter & Music</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs text-pink-200/70 mb-1">Counter Start Date</label>
                                    <input type="datetime-local" id="inpCounterDate" value="${currentConfig.counterStartDate.slice(0,16)}" class="w-full bg-black/30 border border-pink-500/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500 text-white">
                                </div>
                                <div>
                                    <label class="block text-xs text-pink-200/70 mb-1">Counter Label</label>
                                    <input type="text" id="inpCounterLabel" value="${escapeHtml(currentConfig.counterLabel)}" class="w-full bg-black/30 border border-pink-500/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500">
                                </div>
                            </div>
                            <div class="mt-4">
                                <label class="block text-xs text-pink-200/70 mb-1">Background Music Track</label>
                                <select id="inpMusic" class="w-full bg-black/50 border border-pink-500/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500">
                                    <option value="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=romantic-ambient-111043.mp3">Romantic Ambient (Default)</option>
                                    <option value="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c3a7a972.mp3?filename=happy-birthday-jazz-version-10332.mp3">Happy Birthday Jazz</option>
                                    <option value="https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=gentle-piano-love-10086.mp3">Gentle Piano Love</option>
                                </select>
                            </div>
                            <div class="mt-4">
                                <label class="block text-xs text-pink-200/70 mb-1">Optional Password Protection</label>
                                <input type="password" id="inpPassword" value="${escapeHtml(currentConfig.password)}" class="w-full bg-black/30 border border-pink-500/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500" placeholder="Leave empty for public access">
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="pt-4 flex flex-col md:flex-row gap-3">
                            <button onclick="saveAndGenerateLink()" class="flex-1 py-4 px-6 rounded-2xl bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 font-semibold shadow-lg shadow-pink-600/35 transition-all text-center">
                                🚀 Create Shareable Link
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateBuilderTheme(val) {
            currentConfig.theme = val;
            applyTheme(val);
        }

        function collectFormConfig() {
            currentConfig.recipientName = document.getElementById('inpRecipient').value || 'Special Someone';
            currentConfig.linkName = document.getElementById('inpLinkName').value || 'birthday-wish';
            currentConfig.headline = document.getElementById('inpHeadline').value || 'Happy Birthday 🎂';
            currentConfig.cardGreeting = document.getElementById('inpGreeting').value || 'Dearest {name},';
            currentConfig.theme = document.getElementById('inpTheme').value;
            currentConfig.message = document.getElementById('inpMessage').value;
            currentConfig.signOff = document.getElementById('inpSignOff').value;
            currentConfig.counterStartDate = document.getElementById('inpCounterDate').value + ':00';
            currentConfig.counterLabel = document.getElementById('inpCounterLabel').value;
            currentConfig.musicUrl = document.getElementById('inpMusic').value;
            currentConfig.password = document.getElementById('inpPassword').value;
        }

        function previewWish() {
            collectFormConfig();
            window.location.hash = `#/wish?id=preview_${Date.now()}`;
        }

        function saveAndGenerateLink() {
            collectFormConfig();
            const id = saveWishToStorage(currentConfig);
            const shareUrl = window.location.origin + window.location.pathname + `#/wish?id=${id}`;
            
            // Show modal or prompt with link
            const modalHtml = `
                <div id="shareModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
                    <div class="glass-panel p-6 rounded-3xl max-w-md w-full text-center space-y-4 border border-pink-500/40">
                        <div class="w-16 h-16 mx-auto rounded-full bg-pink-600/20 flex items-center justify-center text-3xl">🎉</div>
                        <h3 class="font-cinzel text-xl font-bold text-pink-200">Your Wish is Ready!</h3>
                        <p class="text-xs text-pink-300/80">Share this unique magical link with ${escapeHtml(currentConfig.recipientName)}:</p>
                        <input type="text" readonly id="shareUrlInput" value="${shareUrl}" class="w-full bg-black/50 border border-pink-500/30 rounded-xl px-3 py-2 text-xs text-pink-200 text-center select-all">
                        <div class="flex gap-2 pt-2">
                            <button onclick="navigator.clipboard.writeText('${shareUrl}').then(()=>showToast('Link copied to clipboard! ✨'))" class="flex-1 py-3 rounded-xl bg-pink-600 hover:bg-pink-500 font-semibold text-xs transition-all">📋 Copy Link</button>
                            <button onclick="window.location.hash='#/wish?id=${id}'" class="flex-1 py-3 rounded-xl glass-panel hover:bg-white/10 font-semibold text-xs transition-all">👀 Open Wish</button>
                        </div>
                        <button onclick="document.getElementById('shareModal').remove()" class="text-xs text-pink-400 hover:text-white pt-2">Close</button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        function renderPasswordView() {
            applyTheme(currentConfig.theme);
            document.getElementById('app').innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-6 text-center max-w-sm mx-auto">
                    <div class="w-20 h-20 mb-6 rounded-full glass-panel flex items-center justify-center text-3xl glow-box animate-pulse-glow">🔒</div>
                    <h2 class="font-cinzel text-2xl font-bold mb-2 text-pink-200">Protected Birthday Wish</h2>
                    <p class="text-xs text-pink-300/80 mb-6">Please enter the secret password to unlock this surprise for ${escapeHtml(currentConfig.recipientName)}.</p>
                    <input type="password" id="unlockPassword" placeholder="Enter password" class="w-full bg-black/40 border border-pink-500/40 rounded-xl px-4 py-3 text-sm text-center mb-4 focus:outline-none focus:border-pink-500">
                    <button onclick="verifyPassword()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-pink-600 to-rose-600 font-semibold text-sm shadow-lg shadow-pink-600/30">Unlock Surprise ✨</button>
                </div>
            `;
        }

        function verifyPassword() {
            const pwd = document.getElementById('unlockPassword').value;
            if (pwd === currentConfig.password) {
                sessionStorage.setItem('auth_' + currentConfig.id, 'true');
                activeView = 'wish';
                renderWishView();
            } else {
                showToast('Incorrect password. Please try again!');
            }
        }

        function renderWishView() {
            applyTheme(currentConfig.theme);
            initAudio(currentConfig.musicUrl);
            document.getElementById('audioWidget').classList.remove('flex');
            document.getElementById('audioWidget').style.display = 'flex';

            const formattedGreeting = escapeHtml(currentConfig.cardGreeting).replace('{name}', escapeHtml(currentConfig.recipientName));
            const formattedMessage = escapeHtml(currentConfig.message).replace(/\n/g, '<br>');
            const formattedSignOff = escapeHtml(currentConfig.signOff).replace(/\n/g, '<br>');

            document.getElementById('app').innerHTML = `
                <div class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8 relative z-10 max-w-2xl mx-auto w-full">
                    <!-- Top Header -->
                    <div class="w-full text-center pt-4 space-y-2">
                        <h1 class="font-cinzel text-3xl md:text-5xl font-bold glow-text bg-gradient-to-r from-pink-400 via-rose-300 to-pink-500 bg-clip-text text-transparent">
                            ${escapeHtml(currentConfig.headline)}
                        </h1>
                        <!-- Live Counter -->
                        <div id="liveCounter" class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full glass-panel text-xs md:text-sm text-pink-200 border border-pink-500/30 shadow-lg">
                            ⏳ <span id="counterText">Calculating time...</span>
                        </div>
                    </div>

                    <!-- Center Interactive Tree & Heart Prompt -->
                    <div class="my-auto py-8 text-center flex flex-col items-center justify-center w-full">
                        <div id="heartPrompt" class="transition-all duration-700 cursor-pointer transform hover:scale-105 active:scale-95" onclick="triggerMagicUnlock()">
                            <div class="w-28 h-28 md:w-36 md:h-36 mx-auto rounded-full glass-panel flex items-center justify-center text-5xl md:text-6xl glow-box animate-pulse-glow border-2 border-pink-500/50">
                                💖
                            </div>
                            <p class="mt-4 text-sm md:text-base font-medium text-pink-200 glow-text animate-bounce">
                                Tap to start your magic surprise ✨
                            </p>
                        </div>

                        <!-- Birthday Wish Card (Hidden initially until tapped) -->
                        <div id="wishCard" class="hidden opacity-0 transform translate-y-8 transition-all duration-1000 w-full glass-panel p-6 md:p-8 rounded-3xl shadow-2xl border border-pink-500/40 text-left space-y-4">
                            <h3 class="font-cinzel text-xl md:text-2xl font-bold text-pink-300">${formattedGreeting}</h3>
                            <p class="text-sm md:text-base text-pink-100/90 leading-relaxed font-normal">${formattedMessage}</p>
                            <div class="pt-2 text-sm text-pink-300/80 font-medium whitespace-pre-line">${formattedSignOff}</div>
                        </div>
                    </div>

                    <!-- Footer / Recreate CTA -->
                    <div class="w-full text-center pb-4">
                        <a href="#/create" class="text-xs text-pink-300/60 hover:text-pink-200 underline">✨ Create your own birthday wish for free</a>
                    </div>
                </div>
            `;

            startCounterInterval();
        }

        function triggerMagicUnlock() {
            if (animationUnlocked) return;
            animationUnlocked = true;

            // Start Audio
            const audio = document.getElementById('bgMusic');
            audio.play().then(() => {
                audioPlaying = true;
                document.getElementById('audioLabel').textContent = 'Pause Music';
            }).catch(e => console.log('Audio autoplay prevented'));

            // Hide prompt with fade out
            const prompt = document.getElementById('heartPrompt');
            prompt.style.opacity = '0';
            prompt.style.transform = 'scale(0.8)';
            setTimeout(() => prompt.remove(), 500);

            // Reveal Wish Card with smooth animation
            const card = document.getElementById('wishCard');
            card.classList.remove('hidden');
            setTimeout(() => {
                card.classList.remove('opacity-0', 'translate-y-8');
            }, 50);

            // Trigger particle burst effect
            triggerParticleBurst();
        }

        function startCounterInterval() {
            const updateCounter = () => {
                const start = new Date(currentConfig.counterStartDate).getTime();
                const now = new Date().getTime();
                const diff = now - start;

                if (isNaN(start) || diff < 0) {
                    document.getElementById('counterText').textContent = currentConfig.counterLabel + ': Today! 🎉';
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('counterText').textContent = `${days} Days ${hours}h ${minutes}m ${seconds}s — ${currentConfig.counterLabel}`;
            };
            updateCounter();
            setInterval(updateCounter, 1000);
        }

        // --- Advanced Canvas Animation Engine (Tree, Petals, Particles) ---
        const canvas = document.getElementById('magicCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let petals = [];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, isHeart = false) {
                this.x = x || Math.random() * width;
                this.y = y || Math.random() * height;
                this.size = Math.random() * 3 + 1;
                this.speedY = (Math.random() * 1 - 0.5) * 0.8;
                this.speedX = (Math.random() * 1 - 0.5) * 0.8;
                this.opacity = Math.random() * 0.7 + 0.3;
                this.color = Math.random() > 0.5 ? '#ec4899' : '#f43f5e';
                this.isHeart = isHeart;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Petal {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = -20;
                this.size = Math.random() * 8 + 6;
                this.speedY = Math.random() * 1.5 + 0.8;
                this.speedX = Math.sin(this.y * 0.01) * 1.2;
                this.rotation = Math.random() * 360;
                this.rotSpeed = (Math.random() - 0.5) * 2;
                this.opacity = Math.random() * 0.6 + 0.4;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y * 0.02);
                this.rotation += this.rotSpeed;
                if (this.y > height + 20) this.reset();
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = '#f43f5e';
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Initialize background particles
        for (let i = 0; i < 75; i++) particles.push(new Particle());
        for (let i = 0; i < 25; i++) petals.push(new Petal());

        function triggerParticleBurst() {
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle(width / 2, height / 2));
            }
            for (let i = 0; i < 30; i++) {
                petals.push(new Petal());
            }
        }

        // Draw Heart-Shaped Tree Silhouette in Center
        function drawHeartTree() {
            const centerX = width / 2;
            const centerY = height / 2 - 40;

            ctx.save();
            // Tree Trunk
            ctx.fillStyle = '#3b1c28';
            ctx.beginPath();
            ctx.moveTo(centerX - 12, centerY + 120);
            ctx.lineTo(centerX + 12, centerY + 120);
            ctx.lineTo(centerX + 6, centerY + 20);
            ctx.lineTo(centerX - 6, centerY + 20);
            ctx.fill();

            // Heart Canopy Glow Effect
            const grad = ctx.createRadialGradient(centerX, centerY - 20, 10, centerX, centerY - 20, 130);
            grad.addColorStop(0, 'rgba(244, 63, 94, 0.25)');
            grad.addColorStop(1, 'rgba(236, 72, 153, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(centerX, centerY - 20, 130, 0, Math.PI * 2);
            ctx.fill();

            // Heart Shape Outline with Glowing Dots
            ctx.fillStyle = '#f43f5e';
            const scale = Math.min(width, height) * 0.08;
            for (let t = 0; t < Math.PI * 2; t += 0.15) {
                const hx = 16 * Math.pow(Math.sin(t), 3);
                const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                const px = centerX + hx * (scale / 4.5);
                const py = (centerY - 30) + hy * (scale / 4.5);
                
                ctx.globalAlpha = 0.8;
                ctx.beginPath();
                ctx.arc(px, py, 3.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Draw Heart Tree
            drawHeartTree();

            // Update & Draw Particles
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // Update & Draw Petals
            petals.forEach(pt => {
                pt.update();
                pt.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(>g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
